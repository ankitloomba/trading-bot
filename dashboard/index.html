<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Intra Gini 🔥</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #6b7280;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --purple: #a855f7;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  header { padding: 20px 16px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; font-weight: 700; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .badge.live { background: #166534; color: var(--green); }
  .badge.closed { background: #1c1c1c; color: var(--muted); }
  .badge.starting { background: #7c2d12; color: var(--orange); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card.full { grid-column: 1 / -1; }
  .card label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
  .card .val { font-size: 26px; font-weight: 700; }
  .card .val.green { color: var(--green); }
  .card .val.red { color: var(--red); }
  .card .val.muted { color: var(--muted); font-size: 18px; }

  .section { padding: 0 16px 16px; }
  .section h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }

  .pos-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .pos-name { font-weight: 600; font-size: 15px; }
  .pos-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pos-pnl { text-align: right; }
  .pos-pnl .amt { font-size: 17px; font-weight: 700; }
  .pos-pnl .pct { font-size: 12px; color: var(--muted); }

  .trade-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .trade-row:last-child { border-bottom: none; }
  .trade-sym { font-weight: 600; font-size: 14px; }
  .trade-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .trade-pnl { font-weight: 700; font-size: 15px; }
  .trade-reason { font-size: 10px; color: var(--muted); margin-top: 2px; text-align: right; }

  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 14px; }

  .refresh-bar { text-align: center; padding: 12px; font-size: 11px; color: var(--muted); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  footer { text-align: center; padding: 20px; font-size: 11px; color: #333; }
</style>
</head>
<body>

<header>
  <h1>🔥 Intra Gini</h1>
  <span class="badge starting" id="status-badge">STARTING</span>
</header>

<div class="grid">
  <div class="card">
    <label>Capital</label>
    <div class="val" id="capital">—</div>
  </div>
  <div class="card">
    <label>Today's P&L</label>
    <div class="val" id="daily-pnl">—</div>
  </div>
</div>

<div class="section">
  <h2>Active Positions</h2>
  <div id="positions"><div class="empty">No open positions</div></div>
</div>

<div class="section">
  <h2>Options</h2>
  <div id="options"><div class="empty">No options open</div></div>
</div>

<div class="section">
  <h2>Today's Trades</h2>
  <div class="card full" style="padding:4px 14px">
    <div id="trades"><div class="empty" style="padding:16px">Loading...</div></div>
  </div>
</div>

<div class="refresh-bar">
  <span class="dot"></span>
  <span id="last-update">Updating...</span>
</div>

<footer>Intra Gini · Auto-refreshes every 30s</footer>

<script>
const BOT_URL = ''; // Same origin — bot serves this page

function fmt(n) {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  return (n >= 0 ? '+' : '−') + '₹' + abs.toLocaleString('en-IN', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmtPrice(n) {
  return '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function color(n) { return n >= 0 ? 'green' : 'red'; }

async function fetchStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();

    // Badge
    const badge = document.getElementById('status-badge');
    badge.textContent = d.status;
    badge.className = 'badge ' + (d.status === 'LIVE' ? 'live' : d.status === 'MARKET_CLOSED' ? 'closed' : 'starting');

    // Capital
    document.getElementById('capital').textContent = d.capital ? '₹' + Number(d.capital).toLocaleString('en-IN') : '—';

    // Daily P&L
    const pnlEl = document.getElementById('daily-pnl');
    pnlEl.textContent = d.daily_pnl !== undefined ? fmt(d.daily_pnl) : '—';
    pnlEl.className = 'val ' + (d.daily_pnl >= 0 ? 'green' : 'red');

    // Positions
    const posEl = document.getElementById('positions');
    if (!d.positions || d.positions.length === 0) {
      posEl.innerHTML = '<div class="empty">No open positions</div>';
    } else {
      posEl.innerHTML = d.positions.map(p => `
        <div class="pos-card">
          <div>
            <div class="pos-name">${p.symbol.replace('.NS','').replace('^','')}</div>
            <div class="pos-sub">Entry: ${fmtPrice(p.entry_price)}</div>
          </div>
          <div class="pos-pnl">
            <div class="amt ${color(p.pnl)}">${fmt(p.pnl)}</div>
            <div class="pct">${p.pnl_pct >= 0 ? '+' : ''}${Number(p.pnl_pct).toFixed(2)}%</div>
          </div>
        </div>`).join('');
    }

    // Options
    const optEl = document.getElementById('options');
    if (!d.options || d.options.length === 0) {
      optEl.innerHTML = '<div class="empty">No options open</div>';
    } else {
      optEl.innerHTML = d.options.map(o => `
        <div class="pos-card">
          <div>
            <div class="pos-name">${o.name} @ ₹${o.strike}</div>
            <div class="pos-sub">Entry: ₹${o.entry_premium} · Peak: ₹${o.peak_premium}</div>
          </div>
          <div class="pos-pnl">
            <div class="amt ${color(o.pnl)}">${fmt(o.pnl)}</div>
          </div>
        </div>`).join('');
    }

    document.getElementById('last-update').textContent = 'Last scan: ' + (d.last_scan || '—');
  } catch(e) {
    document.getElementById('status-badge').textContent = 'OFFLINE';
    document.getElementById('status-badge').className = 'badge closed';
  }
}

async function fetchTrades() {
  try {
    const r = await fetch('/api/trades');
    const d = await r.json();
    const el = document.getElementById('trades');
    if (!d.trades || d.trades.length === 0) {
      el.innerHTML = '<div class="empty" style="padding:16px">No trades today yet</div>';
      return;
    }
    el.innerHTML = d.trades.map(t => `
      <div class="trade-row">
        <div>
          <div class="trade-sym">${(t.symbol||'').replace('.NS','')}</div>
          <div class="trade-meta">${t.entry_time||''} → ${t.exit_time||''}</div>
        </div>
        <div>
          <div class="trade-pnl ${color(t.pnl)}">${fmt(t.pnl)}</div>
          <div class="trade-reason">${t.reason||''}</div>
        </div>
      </div>`).join('');
  } catch(e) {}
}

async function refresh() {
  await Promise.all([fetchStatus(), fetchTrades()]);
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
